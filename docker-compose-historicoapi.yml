# HistoricoAPI: conecta-se ao PostgreSQL compartilhado da Fase 3.
#
# O banco NAO faz parte deste arquivo. Suba-o antes, a partir de qualquer
# projeto da fase, com:
#
#   docker compose -f docker-compose-postgres-prod.yml up -d --wait
#   docker compose -f docker-compose-historicoapi.yml up -d
#
# O schema e criado pelas migrations Flyway da AgendamentoAPI. Esta API apenas
# le os dados, entao a AgendamentoAPI precisa ter subido ao menos uma vez.

services:
  historicoapi:
    container_name: HistoricoAPI
    build: .
    image: historicoapi:1.0.0

    # 9027 e a porta da aplicacao dentro do container (perfil prod). No host ela
    # e publicada em 9028 para nao conflitar com a AgendamentoAPI, que tambem
    # escuta em 9027.
    ports:
      - "9028:9027"

    environment:
      TZ: America/Sao_Paulo

      SPRING_PROFILES_ACTIVE: prod

      # Dentro da rede `shared-net` o banco responde pelo hostname do container,
      # sempre na porta interna 5432 (a porta 8745 e apenas a exposicao no host).
      DATABASE_IP: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-postgres}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no arquivo .env}

    volumes:
      - ./logs:/app/logs

    restart: always

    networks:
      - shared-net

networks:
  shared-net:
    external: true

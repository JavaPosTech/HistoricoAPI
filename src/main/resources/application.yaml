logging:
  config: classpath:log4j2.xml

server:
  servlet:
    context-path: /HistoricoAPI

spring:
  application:
    name: historicoapi

  # http://localhost:9017/HistoricoAPI/graphiql
  graphql:
    graphiql:
      enabled: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    encoding:
      charset: UTF-8
      force: true

  jpa:
    open-in-view: false

  data:
    web:
      pageable:
        one-indexed-parameters: true

  web:
    error:
      include-stacktrace: never

# http://localhost:9017/HistoricoAPI/swagger-ui/index.html
springdoc:
  swagger-ui:
    display-request-duration: true
    tags-sorter: alpha

---

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 9017

---

spring:
  config:
    activate:
      on-profile: prod

server:
  port: 9027

---

spring:
  config:
    activate:
      on-profile: test
# Banco de dados compartilhado pelos microsservicos da Fase 3.
#
# Sobe UMA unica vez, a partir de qualquer um dos projetos: o nome do projeto
# Compose e o nome do volume sao fixos, entao o container e os dados sao sempre
# os mesmos, independentemente do diretorio de onde o comando for executado.
#
#   docker compose -f docker-compose-postgres-prod.yml up -d --wait
#
# Tambem e este arquivo que cria a rede `shared-net`, na qual os servicos
# alcancam o banco pelo hostname `postgres` na porta interna `5432`.
#
# O schema e criado pelas migrations Flyway da AgendamentoAPI, executadas
# automaticamente na inicializacao daquele servico.

name: fiap-fase3

services:
  postgres:
    image: postgres:18
    container_name: postgres-fase3

    environment:
      TZ: America/Sao_Paulo

      POSTGRES_DB: ${DATABASE_NAME:-postgres}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no arquivo .env}

    ports:
      - "8745:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

    networks:
      - shared-net

volumes:
  postgres-data:
    name: fiap-postgres-data

networks:
  shared-net:
    name: shared-net
